name: 'Tests (E2E)'

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, ready_for_review]
    paths:
      - '.github/workflows/tests-e2e.yml'
      - 'package.json'
      - 'packages/app/**'
      - 'packages/constants/**'
      - 'packages/db/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'

jobs:
  cypress:
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: pnpm
      - uses: browser-actions/setup-firefox@fcf821c621167805dd63a29662bd7cb5676c81a8 # v1.7.1
        if: matrix.browser == 'firefox'
        with:
          firefox-version: latest
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Cache Cypress binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/Cypress
          key: cypress-binary-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            cypress-binary-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Cypress binary if missing
        working-directory: packages/app
        run: pnpm exec cypress verify || pnpm exec cypress install
      - name: Resolve latest DB dump release
        id: dump
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=$(gh release list --repo "$REPO" --limit 50 \
            --json tagName --jq '[.[] | select(.tagName | startswith("db-dump/"))][0].tagName')
          # Strict format check rejects newlines, shell metacharacters,
          # and anything that could escape later quoting or $GITHUB_OUTPUT.
          if ! printf '%s' "$TAG" | grep -Eq '^db-dump/[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "Unexpected db-dump release tag: $(printf '%q' "$TAG")" >&2
            exit 1
          fi
          DATE=${TAG#db-dump/}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "dir=inferencex-dump-$DATE" >> "$GITHUB_OUTPUT"
      - name: Cache DB dump
        id: cache-dump
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: inferencex-dump
          key: db-dump-${{ steps.dump.outputs.date }}
      - name: Download and extract DB dump
        if: steps.cache-dump.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.dump.outputs.tag }}
          DIR: ${{ steps.dump.outputs.dir }}
        run: |
          set -euo pipefail
          gh release download "$TAG" \
            --repo "$REPO" \
            --pattern '*.zip' \
            --dir .
          mkdir -p inferencex-dump
          unzip -q "${DIR}.zip" -d inferencex-dump
          rm "${DIR}.zip"
      - name: Build app
        run: pnpm build
        env:
          DUMP_DIR: ${{ github.workspace }}/inferencex-dump/${{ steps.dump.outputs.dir }}
      - name: Run component tests
        working-directory: packages/app
        run: pnpm exec cypress run --component
        env:
          CI: true
      - name: Run integration tests
        uses: cypress-io/github-action@c495c3ddffba403ba11be95fffb67e25203b3799 # v7.1.10
        with:
          working-directory: packages/app
          install: false
          start: pnpm start
          wait-on: 'http://localhost:3000'
          browser: ${{ matrix.browser }}
        env:
          CI: true
          DUMP_DIR: ${{ github.workspace }}/inferencex-dump/${{ steps.dump.outputs.dir }}
      - name: Upload Cypress artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: cypress-${{ matrix.browser }}-report
          path: |
            packages/app/cypress/screenshots/
          retention-days: 1
