name: 'Tests (E2E)'

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, ready_for_review]
    paths:
      - '.github/workflows/tests-e2e.yml'
      - 'package.json'
      - 'packages/app/**'
      - 'packages/constants/**'
      - 'packages/db/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'

jobs:
  component-tests:
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 15
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Cache Cypress binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/Cypress
          key: cypress-binary-${{ runner.os }}-${{ runner.arch }}-chrome-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            cypress-binary-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Cypress binary if missing
        working-directory: packages/app
        run: pnpm exec cypress verify || pnpm exec cypress install
      - name: Run component tests
        working-directory: packages/app
        run: pnpm exec cypress run --component --browser chrome
        env:
          CI: true

  build:
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 15
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Build app
        run: pnpm build
        env:
          BLOB_CACHE_PREFIX: ci-cache
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          DATABASE_READONLY_URL: ${{ secrets.DATABASE_READONLY_URL }}
          GITHUB_TOKEN: ${{ secrets.INFX_MAIN_PAT }}
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-build
          path: packages/app/.next/**
          retention-days: 1

  cypress:
    if: ${{ !github.event.pull_request.draft }}
    needs: [component-tests, build]
    continue-on-error: ${{ matrix.browser == 'firefox' }}
    timeout-minutes: 15
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: pnpm
      - uses: browser-actions/setup-firefox@fcf821c621167805dd63a29662bd7cb5676c81a8 # v1.7.1
        if: matrix.browser == 'firefox'
        with:
          firefox-version: latest
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Cache Cypress binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/Cypress
          key: cypress-binary-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            cypress-binary-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Cypress binary if missing
        working-directory: packages/app
        run: pnpm exec cypress verify || pnpm exec cypress install
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: app-build
          path: packages/app/.next
      - name: Select shard specs
        id: shard-specs
        working-directory: packages/app
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: 4
          BROWSER: ${{ matrix.browser }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');

          const shardIndex = Number(process.env.SHARD_INDEX);
          const shardTotal = Number(process.env.SHARD_TOTAL);
          const browser = process.env.BROWSER;
          const eventName = process.env.GITHUB_EVENT_NAME;
          const rootDir = path.resolve(process.cwd(), 'cypress/e2e');
          const outputFile = process.env.GITHUB_OUTPUT;

          function collectSpecs(dir, acc) {
            const entries = fs.readdirSync(dir, { withFileTypes: true });
            for (const entry of entries) {
              const entryPath = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                collectSpecs(entryPath, acc);
                continue;
              }
              if (entry.isFile() && entry.name.endsWith('.cy.ts')) {
                acc.push(path.relative(process.cwd(), entryPath).replaceAll(path.sep, '/'));
              }
            }
          }

          const allSpecs = [];
          collectSpecs(rootDir, allSpecs);
          allSpecs.sort((a, b) => a.localeCompare(b));

          const firefoxSmokeRegex = /(\/|^)(sanity|first-load-navigation|tabs|url-params|blog)\.cy\.ts$/;
          const isFirefoxPullRequest = browser === 'firefox' && eventName === 'pull_request';
          let candidateSpecs = allSpecs;
          if (isFirefoxPullRequest) {
            const smokeSpecs = allSpecs.filter((spec) => firefoxSmokeRegex.test(spec));
            candidateSpecs = smokeSpecs.length > 0 ? smokeSpecs : allSpecs.slice(0, Math.min(5, allSpecs.length));
          }

          const shardCounts = Array.from({ length: shardTotal }, () => 0);
          for (let index = 0; index < candidateSpecs.length; index += 1) {
            shardCounts[index % shardTotal] += 1;
          }

          const assignedSpecs = candidateSpecs.filter(
            (_, index) => index % shardTotal === shardIndex - 1,
          );

          console.log(`Shard ${shardIndex}/${shardTotal} (${process.env.GITHUB_JOB})`);
          console.log(`Total specs discovered: ${allSpecs.length}`);
          console.log(
            `Selection mode: ${
              isFirefoxPullRequest ? 'firefox PR smoke-only' : 'full suite'
            }`,
          );
          console.log(`Candidate specs for this mode: ${candidateSpecs.length}`);
          console.log(`Specs per shard: ${shardCounts.map((count, idx) => `${idx + 1}:${count}`).join(', ')}`);
          console.log(`Assigned specs for this shard: ${assignedSpecs.length}`);
          for (const spec of assignedSpecs) {
            console.log(`- ${spec}`);
          }

          fs.appendFileSync(outputFile, `specs=${assignedSpecs.join(',')}\n`);
          fs.appendFileSync(outputFile, `spec_count=${assignedSpecs.length}\n`);
          fs.appendFileSync(outputFile, `total_specs=${allSpecs.length}\n`);
          EOF
      - name: Start shard timer
        id: shard-timer
        run: echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Run integration tests
        if: ${{ steps.shard-specs.outputs.spec_count != '0' }}
        uses: cypress-io/github-action@c495c3ddffba403ba11be95fffb67e25203b3799 # v7.1.10
        with:
          working-directory: packages/app
          install: false
          start: pnpm start
          wait-on: 'http://localhost:3000'
          browser: ${{ matrix.browser }}
          spec: ${{ steps.shard-specs.outputs.specs }}
        env:
          CI: true
          DATABASE_READONLY_URL: ${{ secrets.DATABASE_READONLY_URL }}
          GITHUB_TOKEN: ${{ secrets.INFX_MAIN_PAT }}
      - name: Log shard execution timing
        if: ${{ always() }}
        env:
          START_EPOCH: ${{ steps.shard-timer.outputs.start_epoch }}
          SHARD_SPEC_COUNT: ${{ steps.shard-specs.outputs.spec_count }}
          TOTAL_SPEC_COUNT: ${{ steps.shard-specs.outputs.total_specs }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_BROWSER: ${{ matrix.browser }}
        run: |
          END_EPOCH="$(date +%s)"
          DURATION_SEC="$((END_EPOCH - START_EPOCH))"
          DURATION_MIN="$((DURATION_SEC / 60))"
          DURATION_REM_SEC="$((DURATION_SEC % 60))"
          echo "Shard timing summary"
          echo "Browser: ${SHARD_BROWSER}"
          echo "Shard: ${SHARD_INDEX}/4"
          echo "Total specs: ${TOTAL_SPEC_COUNT}"
          echo "Specs in this shard: ${SHARD_SPEC_COUNT}"
          if [ "${SHARD_SPEC_COUNT}" = "0" ]; then
            echo "Integration execution time: skipped (no specs assigned)"
            exit 0
          fi
          echo "Integration execution time: ${DURATION_SEC}s (${DURATION_MIN}m ${DURATION_REM_SEC}s)"
      - name: Upload Cypress artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: cypress-${{ matrix.browser }}-report
          path: |
            packages/app/cypress/screenshots/
          retention-days: 1
