name: Apply Run Overrides

on:
  push:
    branches: [main, master]
    paths:
      - 'packages/db/src/etl/run-overrides.ts'
      - 'packages/db/src/etl/power-p90-backfills.ts'
      - 'docs/data/power-p90-backfill.json'
      - '.github/workflows/apply-run-overrides.yml'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Optional GitHub run ID; only apply its registered overrides'
        required: false
        type: string

permissions: {}

concurrency:
  group: apply-run-overrides-production
  cancel-in-progress: false

jobs:
  apply:
    name: Apply run overrides
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ runner.arch }}-${{
            steps.setup-bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ runner.arch }}-${{ steps.setup-bun.outputs.bun-version }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Apply run overrides
        env:
          DATABASE_WRITE_URL: ${{ secrets.DATABASE_WRITE_URL }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          args=(--yes)
          if [[ -n "$RUN_ID" ]]; then
            args+=(--run-id "$RUN_ID")
          fi
          bun run admin:db:apply-overrides "${args[@]}"

      - name: Verify database
        env:
          DATABASE_WRITE_URL: ${{ secrets.DATABASE_WRITE_URL }}
        run: bun run admin:db:verify

      - name: Invalidate cache
        env:
          APP_URL: ${{ vars.APP_URL }}
          INVALIDATE_SECRET: ${{ secrets.VERCEL_INVALIDATE_SECRET }}
          VERCEL_PROTECTION_BYPASS_SECRET: ${{ secrets.VERCEL_PROTECTION_BYPASS_SECRET }}
        run: |
          : "${APP_URL:?APP_URL repository variable is not set}"
          bun run admin:cache:invalidate "$APP_URL"

      - name: Warm cache
        env:
          APP_URL: ${{ vars.APP_URL }}
          VERCEL_PROTECTION_BYPASS_SECRET: ${{ secrets.VERCEL_PROTECTION_BYPASS_SECRET }}
        run: |
          : "${APP_URL:?APP_URL repository variable is not set}"
          bun run admin:cache:warmup "$APP_URL"
