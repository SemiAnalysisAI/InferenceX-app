name: 'Warm CI caches'

# Refreshes the sticky disks Tests (E2E) and Tests (Unit) mount, so pull requests build against
# the latest main. Blacksmith only persists sticky-disk writes from default-branch jobs.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  warm:
    name: Warm E2E build caches
    if: ${{ github.repository == 'SemiAnalysisAI/InferenceX-app' && github.ref == 'refs/heads/main' }}
    timeout-minutes: 10
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3
        with:
          persist-credentials: false
      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # Keys must match the mounts in tests-e2e.yml and tests-unit.yml.
      - name: Mount node_modules
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: ${{ github.repository }}-node-modules-${{ runner.arch }}-bun-${{ steps.setup-bun.outputs.bun-version }}
          path: ./node_modules
          commit: on-change
      - name: Mount Next.js build cache
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: ${{ github.repository }}-nextjs-cache-${{ runner.arch }}
          path: ./packages/app/.next/cache
          commit: on-change
      - name: Mount Cypress binary
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: ${{ github.repository }}-cypress-binary-${{ runner.arch }}
          path: /home/runner/.cache/Cypress
          commit: on-change
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Build app
        run: bun run build
        env:
          E2E_FIXTURES: '1'
      - name: Install Cypress binary if missing
        working-directory: packages/app
        run: bunx cypress verify || bunx cypress install
