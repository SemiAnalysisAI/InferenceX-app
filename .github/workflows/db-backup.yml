name: Database Dump

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at midnight UTC
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified dump as a GitHub release
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  POSTGRES_IMAGE: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15

jobs:
  preflight:
    name: Preflight
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read # Tag-collision check
    outputs:
      prefix: ${{ steps.names.outputs.prefix }}
      tag: ${{ steps.names.outputs.tag }}
      date: ${{ steps.names.outputs.date }}
    steps:
      - name: Compute dump name and release tag
        id: names
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y-%m-%d)"
          {
            echo "date=${DATE}"
            echo "prefix=inferencex-${DATE}"
            echo "tag=db-dump/${DATE}"
          } >> "$GITHUB_OUTPUT"

      - name: Fail fast if the release tag already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.names.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; delete it first to re-dump for the same date."
            exit 1
          fi

  dump:
    name: Dump and compress
    needs: preflight
    timeout-minutes: 360
    runs-on: blacksmith-32vcpu-ubuntu-2404
    permissions:
      contents: read # Check out the dump script
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The public dump holds what end users need to reproduce published
      # results: every table's schema, the core result tables, PowerX
      # telemetry, and AgentX derived data. Raw traces, engine logs and eval
      # prompts are left out; see docs/public-db-dump.md.
      - name: Export database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_WRITE_URL }}
          PREFIX: ${{ needs.preflight.outputs.prefix }}
        run: |
          set -euo pipefail
          docker run -d --name pg-client "$POSTGRES_IMAGE" sleep infinity
          PG_EXEC='docker exec -i pg-client' \
            .github/scripts/db-dump.sh export "$DATABASE_URL" "$PREFIX"
          docker rm -f pg-client >/dev/null
          ls -l "$PREFIX".*.part*

      - name: Verify compressed streams
        env:
          PREFIX: ${{ needs.preflight.outputs.prefix }}
        run: |
          set -euo pipefail
          cat "$PREFIX".dump.zst.part* | zstd -t --long=27
          cat "$PREFIX".agentx.copy.zst.part* | zstd -t --long=27

      # Restore with the published script into a throwaway PostgreSQL, so a
      # dump that cannot be restored is never published.
      - name: Verify the dump restores
        env:
          WORK_DIR: ${{ runner.temp }}/restore-check
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR"
          docker run -d --name restore-check --shm-size=2g \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -v "$PWD:$PWD" -v "$WORK_DIR:$WORK_DIR" \
            "$POSTGRES_IMAGE" \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off \
            -c max_wal_size=8GB -c maintenance_work_mem=1GB
          for _ in $(seq 1 60); do
            docker exec restore-check pg_isready -U postgres -q && break
            sleep 2
          done
          export PG_EXEC='docker exec -i restore-check'
          target='postgres://postgres@localhost/postgres'
          RESTORE_WORK_DIR="$WORK_DIR" .github/scripts/db-dump.sh restore "$target" "$PWD"
          status=0
          .github/scripts/db-dump.sh check "$target" | tee "$WORK_DIR/counts.tsv" || status=$?
          {
            echo '### Restored row counts'
            echo
            echo '```'
            cat "$WORK_DIR/counts.tsv"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          docker rm -f restore-check >/dev/null
          rm -rf "$WORK_DIR"
          exit "$status"

      - name: Checksum release assets
        env:
          PREFIX: ${{ needs.preflight.outputs.prefix }}
        run: |
          set -euo pipefail
          cp .github/scripts/db-dump.sh .
          sha256sum "$PREFIX".*.part* db-dump.sh > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: db-dump-parts
          path: |
            inferencex-*.part*
            db-dump.sh
            SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    name: Create release
    needs: [preflight, dump]
    if: github.event_name == 'schedule' || inputs.publish
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the database dump release
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: db-dump-parts

      - name: Verify checksums
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          DATE: ${{ needs.preflight.outputs.date }}
          PREFIX: ${{ needs.preflight.outputs.prefix }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          Weekly InferenceX database dump.

          Contents: every table's schema; all benchmark, evaluation-score, reliability,
          availability, changelog and dataset data; PowerX GPU telemetry; and AgentX
          per-point data (`aggregate_stats`, `chart_series`, `request_timeline`).
          Left out: raw AgentX trace payloads, engine server logs, per-sample eval
          prompts and responses, and user feedback.

          Restore into an empty PostgreSQL 18 database (needs PostgreSQL 18 client
          tools and `zstd`). Download every asset of this release into one directory, then:

          ```
          shasum -a 256 -c SHA256SUMS
          bash db-dump.sh restore "postgres://USER:PASSWORD@HOST/DATABASE" .
          ```
          EOF

          gh release create "$TAG" "$PREFIX".*.part* db-dump.sh SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "DB Dump $DATE" \
            --notes-file release-notes.md \
            --latest=false

  notify:
    name: Notify Slack on failure
    needs: [preflight, dump, release]
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":rotating_light: *Database dump failed*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
