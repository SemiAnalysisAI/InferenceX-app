name: 'Tests (Unit)'

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, ready_for_review]
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed files
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # List the pull request's changed files.
    outputs:
      run: ${{ steps.match.outputs.run }}
    steps:
      # Pull requests skip the suite when nothing it covers changed; the merge queue always runs it.
      - id: match
        name: Match changed files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PATTERN: '^(\.github/workflows/tests-unit\.yml$|package\.json$|packages/(app|constants|db|mcp|skills)/|bunfig\.toml$|bun\.lock$|patches/|scripts/run-workspace-script\.ts$|tsconfig(\.base)?\.json$)'
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')"
          if (( $(wc -l <<< "$files") >= 3000 )) || grep -qE "$PATTERN" <<< "$files"; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi

  vitest:
    name: Unit tests (${{ matrix.name }})
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' && !github.event.pull_request.draft }}
    timeout-minutes: 10
    runs-on: blacksmith-16vcpu-ubuntu-2404
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Tests (Skills) runs the packed skills suite; it reads no app source.
        include:
          - name: app
            workspaces: packages/app
          - name: db
            workspaces: packages/db
          - name: constants and mcp
            workspaces: packages/constants packages/mcp
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3
        with:
          persist-credentials: false
      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # Tests (E2E) commits this disk; other jobs only read it.
      - name: Mount node_modules
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: ${{ github.repository }}-node-modules-${{ runner.arch }}-bun-${{ steps.setup-bun.outputs.bun-version }}
          path: ./node_modules
          commit: 'false'
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: '0'
      # Only the app suite restores Vitest's fsModuleCache.
      - name: Cache Vitest module transforms
        if: ${{ matrix.name == 'app' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vitest-cache
          key: ${{ runner.os }}-vitest-modules-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vitest-modules-${{ hashFiles('bun.lock') }}-
      - name: Unit tests
        env:
          WORKSPACES: ${{ matrix.workspaces }}
        run: for dir in $WORKSPACES; do bun run --cwd "$dir" test:unit; done

  result:
    name: Unit tests
    needs: [changes, vitest]
    if: ${{ always() }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail when a unit test job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
