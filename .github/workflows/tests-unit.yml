name: 'Tests (Unit)'

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, ready_for_review]
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed files
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # List the pull request's changed files.
    outputs:
      run: ${{ steps.match.outputs.run }}
    steps:
      # Pull requests skip the suite when nothing it covers changed; the merge queue always runs it.
      - id: match
        uses: $/.github/actions/changed-files
        with:
          token: ${{ github.token }}
          pattern: '^(\.github/workflows/tests-unit\.yml$|\.github/actions/|package\.json$|packages/(app|constants|db|mcp|skills)/|bunfig\.toml$|bun\.lock$|patches/|scripts/run-workspace-script\.ts$|tsconfig(\.base)?\.json$)'

  unit:
    name: Unit tests (${{ matrix.name }})
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' && !github.event.pull_request.draft }}
    timeout-minutes: 10
    runs-on: blacksmith-16vcpu-ubuntu-2404
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Tests (Skills) runs the packed skills suite; it reads no app source.
        include:
          - name: app
            workspaces: packages/app
          - name: db
            workspaces: packages/db
          - name: constants and mcp
            workspaces: packages/constants packages/mcp
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-workspace
      - name: Unit tests
        env:
          WORKSPACES: ${{ matrix.workspaces }}
        run: for dir in $WORKSPACES; do bun run --cwd "$dir" test:unit; done

  result:
    name: Unit tests
    needs: [changes, unit]
    if: ${{ always() }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail when a unit test job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
