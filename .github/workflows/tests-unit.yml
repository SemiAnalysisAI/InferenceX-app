name: 'Tests (Unit)'

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, ready_for_review]
    paths:
      - '.github/workflows/tests-unit.yml'
      - 'package.json'
      - 'packages/app/**'
      - 'packages/constants/**'
      - 'packages/db/**'
      - 'bunfig.toml'
      - 'bun.lock'
      - 'scripts/run-workspace-script.ts'
      - 'tsconfig.json'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: Typecheck and unit tests
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 10
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ runner.arch }}-${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ runner.arch }}-${{ steps.setup-bun.outputs.bun-version }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test:unit
