name: Warm After Deploy

# Vercel's CDN cache key includes the deployment, so every production promotion
# starts with an empty cache. OperatorX's first uncached responses take seconds
# (cold function, database connection, merged comparison), so request them once
# here instead of on a visitor's load. `vercel.deployment.promoted` fires once
# the production domain serves the new deployment, for automatic deploys,
# manual promotions, and rollbacks. The cache is also per region: this fills the
# region nearest the runner and leaves a warm function for the others.
on:
  repository_dispatch:
    types: [vercel.deployment.promoted]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  warm:
    name: Warm OperatorX
    if: github.event_name == 'workflow_dispatch' || github.event.client_payload.environment == 'production'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Warm OperatorX pages and API
        env:
          APP_URL: ${{ vars.APP_URL }}
          VERCEL_PROTECTION_BYPASS_SECRET: ${{ secrets.VERCEL_PROTECTION_BYPASS_SECRET }}
        run: |
          : "${APP_URL:?APP_URL repository variable is not set}"
          headers=()
          if [ -n "$VERCEL_PROTECTION_BYPASS_SECRET" ]; then
            headers+=(-H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS_SECRET")
          fi
          # Consume each full response: a streamed body that is cut off is not cached.
          for path in /operatorx /zh/operatorx /api/v1/operatorx/runs \
            '/api/v1/operatorx/compare?op=gemm' '/api/v1/operatorx/compare?op=moe'; do
            curl -sSf --retry 2 --retry-delay 2 --max-time 300 --compressed \
              -o /dev/null -w "%{http_code} %{time_total}s $path\n" \
              "${APP_URL%/}$path" "${headers[@]}"
          done
