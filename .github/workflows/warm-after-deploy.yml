name: Warm After Deploy

# Vercel's CDN cache key includes the deployment, so every production promotion
# starts with an empty cache. First uncached responses take seconds (cold
# function, database connection, large JSON, OperatorX merged comparison), so
# request the dashboard APIs, OperatorX, and the top pages once here instead of
# on a visitor's load. `vercel.deployment.promoted` fires once the production
# domain serves the new deployment, for automatic deploys, manual promotions,
# and rollbacks. The cache is also per region: this fills the region nearest the
# runner and leaves warm functions and server caches for the others.
on:
  repository_dispatch:
    types: [vercel.deployment.promoted]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  warm:
    name: Warm dashboards, OperatorX and top pages
    if: github.event_name == 'workflow_dispatch' || github.event.client_payload.environment == 'production'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ runner.arch }}-${{
            steps.setup-bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ runner.arch }}-${{ steps.setup-bun.outputs.bun-version }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Warm dashboard APIs
        env:
          APP_URL: ${{ vars.APP_URL }}
          VERCEL_PROTECTION_BYPASS_SECRET: ${{ secrets.VERCEL_PROTECTION_BYPASS_SECRET }}
        run: |
          : "${APP_URL:?APP_URL repository variable is not set}"
          bun run admin:cache:warmup "$APP_URL" --dashboard

      # A deployment that changes the video History projection starts without a current
      # snapshot. Rebuild it once here. It writes nothing when every record is current.
      - name: Backfill video History snapshot
        env:
          APP_URL: ${{ vars.APP_URL }}
          INVALIDATE_SECRET: ${{ secrets.VERCEL_INVALIDATE_SECRET }}
          VERCEL_PROTECTION_BYPASS_SECRET: ${{ secrets.VERCEL_PROTECTION_BYPASS_SECRET }}
        run: |
          : "${APP_URL:?APP_URL repository variable is not set}"
          : "${INVALIDATE_SECRET:?VERCEL_INVALIDATE_SECRET is not set}"
          headers=(-H "Authorization: Bearer $INVALIDATE_SECRET" -H "Content-Type: application/json")
          if [ -n "$VERCEL_PROTECTION_BYPASS_SECRET" ]; then
            headers+=(-H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS_SECRET")
          fi
          status=$(curl -sS --retry 2 --retry-delay 5 --max-time 300 -X POST \
            -o "$RUNNER_TEMP/video-history.json" -w '%{http_code}' \
            "${APP_URL%/}/api/video-runs" "${headers[@]}" -d '{"history":"backfill"}')
          if [ "$status" = 503 ] && grep -q 'Video storage is not configured' "$RUNNER_TEMP/video-history.json"; then
            echo '::notice::This deployment has no video storage; skipped the History snapshot'
          elif [ "$status" != 200 ]; then
            cat "$RUNNER_TEMP/video-history.json"
            echo "::error::Video History backfill returned HTTP $status"
            exit 1
          fi

      - name: Warm OperatorX and top pages
        env:
          APP_URL: ${{ vars.APP_URL }}
          VERCEL_PROTECTION_BYPASS_SECRET: ${{ secrets.VERCEL_PROTECTION_BYPASS_SECRET }}
        run: |
          : "${APP_URL:?APP_URL repository variable is not set}"
          # API responses are cached per Accept-Encoding: request the browser's variant.
          headers=(-H "Accept-Encoding: gzip, deflate, br, zstd")
          if [ -n "$VERCEL_PROTECTION_BYPASS_SECRET" ]; then
            headers+=(-H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS_SECRET")
          fi
          # Consume each full response: a streamed body that is cut off is not cached.
          for path in / /zh /inference /zh/inference /historical /evaluation /operatorx /zh/operatorx; do
            curl -sSf --retry 2 --retry-delay 2 --max-time 300 --compressed \
              -o /dev/null -w "%{http_code} %{time_total}s $path\n" \
              "${APP_URL%/}$path" "${headers[@]}"
          done
          status=$(curl -sS --retry 2 --retry-delay 2 --max-time 300 --compressed \
            -o "$RUNNER_TEMP/operatorx-runs.json" -w '%{http_code}' \
            "${APP_URL%/}/api/v1/operatorx/runs" "${headers[@]}")
          if [ "$status" = 503 ] && grep -q 'The OperatorX database is not configured' "$RUNNER_TEMP/operatorx-runs.json"; then
            echo '::notice::This deployment has no OperatorX database; skipped its APIs'
            exit 0
          fi
          if [ "$status" != 200 ]; then
            cat "$RUNNER_TEMP/operatorx-runs.json"
            echo "::error::/api/v1/operatorx/runs returned HTTP $status"
            exit 1
          fi
          for path in '/api/v1/operatorx/compare?op=gemm' '/api/v1/operatorx/compare?op=moe'; do
            curl -sSf --retry 2 --retry-delay 2 --max-time 300 --compressed \
              -o /dev/null -w "%{http_code} %{time_total}s $path\n" \
              "${APP_URL%/}$path" "${headers[@]}"
          done
