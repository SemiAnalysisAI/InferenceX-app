name: Check published InferenceX skills API contract

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: 'Exact published package version to check'
        required: true
        default: '0.11.0'
        type: string
  # Daily scheduling stays inactive until the published 1.0.0 archive passes public verification.

permissions:
  contents: read

concurrency:
  group: check-published-inferencex-skills-api
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - name: Check the exact published package and consumed API contract
        env:
          CHECK_PACKAGE_VERSION: ${{ inputs.package_version }}
        run: >-
          node packages/skills/scripts/check-public-api.mjs
          --package-version "$CHECK_PACKAGE_VERSION"
          --output-dir "$RUNNER_TEMP/inferencex-skills-api-check"
      - name: Preserve the bounded check record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: inferencex-skills-api-check-${{ inputs.package_version }}-${{ github.run_id }}
          path: ${{ runner.temp }}/inferencex-skills-api-check/
          if-no-files-found: ignore
          retention-days: 30
