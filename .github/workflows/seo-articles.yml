name: SEO Articles

on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  generate:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          token: ${{ secrets.PAT }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --filter @semianalysisai/inferencex-app...
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Fetch benchmark data
        run: pnpm admin:seo:data

      - name: Generate articles with Claude
        uses: anthropics/claude-code-action@88c168b39e7e64da0286d812b6e9fbebb6708185 # v1.0.82
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.PAT }}
          direct_prompt: |
            You are updating SEO blog articles for InferenceX with fresh benchmark data.

            ## Instructions
            1. Read the article template at `packages/app/scripts/seo/article-template.md`
            2. Read the benchmark data at `packages/app/tmp/seo-data.json`
            3. For each model in the data:
               a. Check if `packages/app/content/blog/best-gpu-for-<modelKey>-inference.mdx` exists.
               b. If it EXISTS: read it, then edit in place (see Update Rules below).
               c. If it does NOT exist: create it from scratch following the template.
            4. Same for the rollup at `packages/app/content/blog/inference-benchmark-roundup.mdx`.
               The rollup MUST include GPU head-to-head comparison sections (see template).

            ## Update Rules (edit-in-place for existing articles)

            The goal is MINIMAL diffs. Only change what the new data requires.

            **Always update:**
            - `modifiedDate` and `publishDate` in frontmatter → today's date
            - `*Last updated: YYYY-MM-DD.*` → today's date
            - All markdown tables → regenerate from new data (sort by throughput descending)
            - Key Findings bullets → update numbers and GPU names if rankings changed
            - JSON-LD answers → update to match any changed FAQ prose

            **Update only if the data changed the conclusion:**
            - FAQ prose (e.g. if the winner GPU changed, or a new GPU appeared, rewrite that FAQ)
            - Subtitle (if the winner or key insight changed)
            - Intro (if GPU count or framework count changed meaningfully)

            **Never touch unless factually wrong:**
            - Prose phrasing that is still accurate (don't reword for variety)
            - Cross-links section (unless new model articles were added)
            - ClusterMax CTA
            - Methodology section (unless the template changed)
            - `date` in frontmatter (preserve the original)

            **For new sections** (e.g. a new FAQ that applies because new data appeared):
            - Add it in the correct position per the template ordering.
            - Follow the template's writing style guidelines.

            **For removed sections** (e.g. a FAQ that no longer applies):
            - Remove it and update the JSON-LD to match.

            ## Critical Rules
            - ALL numbers MUST come from the data file. Never invent or estimate numbers.
            - TTFT/TPOT/E2EL values in the data are in SECONDS — multiply by 1000 for display in ms.
            - Use gpuDisplayName from the data for all GPU references.
            - The runner-up in Key Findings must be a DIFFERENT GPU than the winner.
            - Skip the 1k/8k sequence entirely — it is deprecated.
            - Format large numbers with commas (e.g. xx,xxx.x).
            - ZERO em dashes in prose. Only allowed in prescribed headings and title frontmatter.

            ## Mandatory Editing Pass
            After updating EACH article, re-read it and run these fixes before moving on:
            1. Search the file for "—". Remove every em dash not in a heading or title.
               Replace with comma, period, semicolon, or parentheses (see template).
            2. Search for banned words (see template). Replace with plain English.
            3. Check consecutive sentence starts aren't identical.
            4. Cut filler sentences that restate the previous one.
          allowed_tools: 'Read,Write,Edit,Glob,Grep,Bash'
          claude_args: '--model claude-sonnet-4-5-20250929'

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- 'packages/app/content/blog/'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="seo/update-articles-${DATE}"
          git checkout -b "$BRANCH"
          git add 'packages/app/content/blog/'
          git commit -m "update SEO benchmark articles (${DATE})"
          git push origin "$BRANCH"
          gh pr create \
            --title "update SEO benchmark articles (${DATE})" \
            --body "$(cat <<'EOF'
          ## Summary
          - Auto-generated SEO blog articles from latest benchmark data
          - Articles written by Claude using real data from `seo-data.json`

          ## Review checklist
          - [ ] Spot-check numbers against live dashboard
          - [ ] Verify JSON-LD in page source
          - [ ] Read prose for quality and accuracy
          EOF
          )" \
            --base master
