name: SEO Articles

on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  generate:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --filter @semianalysisai/inferencex-app...
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Fetch benchmark data
        run: pnpm admin:seo:data

      - name: Generate articles with Claude
        uses: anthropics/claude-code-action@88c168b39e7e64da0286d812b6e9fbebb6708185 # v1.0.82
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          direct_prompt: |
            You are updating SEO blog articles for InferenceX with fresh benchmark data.
            There are THREE article types. Read ALL templates before starting.

            ## Templates
            - Per-model roundup: `packages/app/scripts/seo/article-template.md`
            - GPU matchup: `packages/app/scripts/seo/matchup-template.md`
            - Performance update: `packages/app/scripts/seo/update-template.md`

            ## Data
            Read the benchmark data at `packages/app/tmp/seo-data.json`. It contains:
            - `models[]` — per-model benchmark data with cost fields and history
            - `matchups[]` — GPU pair data for head-to-head articles
            - `improvements[]` — significant performance gains for update articles

            ## Instructions

            ### 1. Per-model roundup articles (update existing or create new)
            For each model in `models[]`:
            a. Check if `packages/app/content/blog/best-gpu-for-<modelKey>-inference.mdx` exists.
            b. If it EXISTS: edit in place with minimal diffs (see Update Rules below).
            c. If it does NOT exist: create from scratch per `article-template.md`.
            d. Same for the rollup at `packages/app/content/blog/inference-benchmark-roundup.mdx`.

            ### 2. GPU matchup articles (create top 3 most interesting)
            From the `matchups[]` array, pick the 3 matchups with the most shared models
            (break ties by closest `avgPctDiff`). For each:
            a. Check if the article exists at `packages/app/content/blog/<slug>.mdx`.
            b. If it EXISTS: edit in place. If NOT: create per `matchup-template.md`.
            c. Slug format: `<gpuA>-vs-<gpuB>-inference` (e.g. `b200-vs-mi355x-inference`).

            ### 3. Performance update articles (create for top 3 improvements)
            From the `improvements[]` array (already sorted by pctGain descending), take the
            top 3 improvements. For each:
            a. Check if the article exists. If NOT: create per `update-template.md`.
            b. If it EXISTS: edit in place (update numbers only).
            c. Slug format: `<gpu>-<framework>-<model>-update-<date>` from the improvement data.

            ## Update Rules (edit-in-place for existing articles)
            The goal is MINIMAL diffs. Only change what the new data requires.

            **Always update:** dates, tables, Key Findings numbers, BenchmarkChart data,
            TrendChart data, InteractivityChart data, JSON-LD.

            **Update only if conclusion changed:** FAQ prose, subtitle, intro.

            **Never touch unless wrong:** accurate prose, cross-links, CTA, methodology,
            original `date` frontmatter.

            ## Critical Rules
            - ALL numbers from data file only. Never invent numbers.
            - TTFT/TPOT values in data are SECONDS — multiply by 1000 for ms.
            - Use gpuDisplayName from data for all GPU references.
            - $/Mtok: use costMtokHyperscaler, format to 2 decimal places.
            - Runner-up must be DIFFERENT GPU than winner.
            - Skip 1k/8k sequence entirely.
            - Format large numbers with commas.
            - ZERO em dashes in prose (only in prescribed headings/titles).
            - BenchmarkChart: use data='...' prop (single-quoted JSON, self-closing tag).
            - TrendChart/InteractivityChart: same data='...' prop pattern.

            ## Mandatory Editing Pass
            After each article:
            1. Em dash sweep — remove all outside headings/titles.
            2. Banned word sweep — see article-template.md for the full list.
            3. Chart count check — every table must have a BenchmarkChart.
            4. Consecutive sentence start check.
            5. Filler sentence removal.
          allowed_tools: 'Read,Write,Edit,Glob,Grep,Bash'
          claude_args: '--model claude-sonnet-4-5-20250929'

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- 'packages/app/content/blog/'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="seo/update-articles-${DATE}"
          git checkout -b "$BRANCH"
          git add 'packages/app/content/blog/'
          git commit -m "update SEO benchmark articles (${DATE})"
          git push origin "$BRANCH"
          gh pr create \
            --title "update SEO benchmark articles (${DATE})" \
            --body "$(cat <<'EOF'
          ## Summary
          - Per-model roundup articles (updated or created)
          - GPU matchup articles (top 3 most interesting pairs)
          - Performance update articles (top 3 improvements >20%)
          - All from real benchmark data in `seo-data.json`

          ## Review checklist
          - [ ] Spot-check numbers against live dashboard
          - [ ] Verify charts render in dev server
          - [ ] Verify JSON-LD in page source
          - [ ] Read prose for quality and accuracy
          - [ ] Check no AI tells (em dashes, banned words)
          EOF
          )" \
            --base master
