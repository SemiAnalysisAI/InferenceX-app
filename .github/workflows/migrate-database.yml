name: Migrate Database

on:
  workflow_dispatch:
    inputs:
      database-target:
        description: Explicit database target; existing measurements are preserved
        required: true
        type: choice
        options: [staging, production]
      expected-sha:
        description: Exact reviewed 40-character app commit to migrate and verify
        required: true
        type: string

permissions: {}

concurrency:
  group: database-migrations-${{ inputs.database-target }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate and verify selected database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      MIGRATION_DATABASE_TARGET: ${{ inputs.database-target }}
      MIGRATION_EXPECTED_SHA: ${{ inputs.expected-sha }}
    steps:
      - name: Validate exact migration request
        shell: python
        run: |
          import os
          import re

          if os.environ['GITHUB_REF'] != 'refs/heads/master':
              raise ValueError('Database migrations must execute the reviewed master branch')
          if os.environ['MIGRATION_DATABASE_TARGET'] not in {'staging', 'production'}:
              raise ValueError('An explicit staging or production database target is required')
          expected = os.environ['MIGRATION_EXPECTED_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', expected) or expected != os.environ['GITHUB_SHA']:
              raise ValueError('The workflow commit must equal the exact reviewed expected-sha')

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Apply staging migrations and verify receipt schema
        if: inputs.database-target == 'staging'
        env:
          DATABASE_WRITE_URL: ${{ secrets.DATABASE_STAGING_WRITE_URL }}
        run: |
          bun run admin:db:migrate --yes
          bun packages/db/src/verify-measurement-schema.ts migration-report.json

      - name: Apply production migrations and verify receipt schema
        if: inputs.database-target == 'production'
        env:
          DATABASE_WRITE_URL: ${{ secrets.DATABASE_WRITE_URL }}
        run: |
          bun run admin:db:migrate --yes
          bun packages/db/src/verify-measurement-schema.ts migration-report.json

      - name: Retain migration verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: measurement-schema-${{ inputs.database-target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: migration-report.json
          if-no-files-found: ignore
