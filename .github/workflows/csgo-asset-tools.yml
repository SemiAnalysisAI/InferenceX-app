name: CS:GO asset tooling

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'tools/csgo-assets/**'
      - '.github/workflows/csgo-asset-tools.yml'

permissions:
  contents: read

jobs:
  tooling:
    name: Asset importer, offline match and acceptance-report tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: node --test tools/csgo-assets/*.test.mjs
      - name: Syntax checks
        run: |
          node --check tools/csgo-assets/prepare.mjs
          node --check tools/csgo-assets/viewer.mjs
          node --check tools/csgo-assets/game.mjs
          node --check tools/csgo-assets/match.mjs
          node --check tools/csgo-assets/navigation.mjs
  parity:
    name: Dust II game acceptance (not yet satisfied)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: node tools/csgo-assets/parity-gate.mjs
