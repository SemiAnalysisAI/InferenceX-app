name: Cache Refresh

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Cache scope (OperatorX is separate from dashboards)
        type: choice
        default: dashboards
        options:
          - dashboards
          - operatorx

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh cache
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate cache scope
        env:
          CACHE_SCOPE: ${{ inputs.scope || 'dashboards' }}
        run: |
          case "$CACHE_SCOPE" in
            dashboards|operatorx) ;;
            *) echo 'Unsupported cache scope' >&2; exit 2 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ runner.arch }}-${{
            steps.setup-bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ runner.arch }}-${{ steps.setup-bun.outputs.bun-version }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Invalidate cache
        if: inputs.scope != 'operatorx'
        env:
          APP_URL: ${{ vars.APP_URL }}
          INVALIDATE_SECRET: ${{ secrets.VERCEL_INVALIDATE_SECRET }}
          VERCEL_PROTECTION_BYPASS_SECRET: ${{ secrets.VERCEL_PROTECTION_BYPASS_SECRET }}
        run: |
          : "${APP_URL:?APP_URL repository variable is not set}"
          bun run admin:cache:invalidate "$APP_URL" --immediate

      - name: Warm up cache
        if: inputs.scope != 'operatorx'
        env:
          APP_URL: ${{ vars.APP_URL }}
          VERCEL_PROTECTION_BYPASS_SECRET: ${{ secrets.VERCEL_PROTECTION_BYPASS_SECRET }}
        run: |
          : "${APP_URL:?APP_URL repository variable is not set}"
          bun run admin:cache:warmup "$APP_URL"

      - name: Invalidate OperatorX cache
        if: inputs.scope == 'operatorx'
        env:
          APP_URL: ${{ vars.APP_URL }}
          INVALIDATE_SECRET: ${{ secrets.VERCEL_INVALIDATE_SECRET }}
          VERCEL_PROTECTION_BYPASS_SECRET: ${{ secrets.VERCEL_PROTECTION_BYPASS_SECRET }}
        run: |
          : "${APP_URL:?APP_URL repository variable is not set}"
          : "${INVALIDATE_SECRET:?VERCEL_INVALIDATE_SECRET secret is not set}"
          headers=(-H "Authorization: Bearer $INVALIDATE_SECRET")
          if [ -n "$VERCEL_PROTECTION_BYPASS_SECRET" ]; then
            headers+=(-H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS_SECRET")
          fi
          curl -sSf -X POST "${APP_URL%/}/api/v1/invalidate?scope=operatorx&immediate=true" "${headers[@]}" \
            | jq -e '.invalidated == true and .scope == "operatorx" and .immediate == true'

      - name: Warm OperatorX comparisons
        if: inputs.scope == 'operatorx'
        env:
          APP_URL: ${{ vars.APP_URL }}
          VERCEL_PROTECTION_BYPASS_SECRET: ${{ secrets.VERCEL_PROTECTION_BYPASS_SECRET }}
        run: |
          : "${APP_URL:?APP_URL repository variable is not set}"
          headers=(-H 'Accept-Encoding: gzip, deflate, br, zstd')
          if [ -n "$VERCEL_PROTECTION_BYPASS_SECRET" ]; then
            headers+=(-H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS_SECRET")
          fi
          for op in gemm moe; do
            curl -sSf --retry 2 --retry-delay 2 --max-time 120 --compressed \
              "${APP_URL%/}/api/v1/operatorx/compare?op=$op" "${headers[@]}" -o /dev/null
          done
