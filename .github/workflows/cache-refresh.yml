name: Cache Refresh

on:
  workflow_dispatch:
  # A deployment that reads the public database caches its results; refresh it hourly so
  # new public results show up. Scheduled runs skip repositories without that secret.
  schedule:
    - cron: '17 * * * *'

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  gate:
    name: Check trigger
    if: github.event_name != 'schedule' || github.repository != 'SemiAnalysisAI/InferenceX-app'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check trigger
        id: check
        env:
          EVENT: ${{ github.event_name }}
          PUBLIC_DATABASE_READONLY_URL: ${{ secrets.PUBLIC_DATABASE_READONLY_URL }}
        run: |
          if [ "$EVENT" != schedule ] || [ -n "$PUBLIC_DATABASE_READONLY_URL" ]; then
            echo run=true >>"$GITHUB_OUTPUT"
          fi

  refresh:
    name: Refresh cache
    needs: gate
    if: needs.gate.outputs.run == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ runner.arch }}-${{
            steps.setup-bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ runner.arch }}-${{ steps.setup-bun.outputs.bun-version }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Invalidate cache
        env:
          APP_URL: ${{ vars.APP_URL }}
          INVALIDATE_SECRET: ${{ secrets.VERCEL_INVALIDATE_SECRET }}
          VERCEL_PROTECTION_BYPASS_SECRET: ${{ secrets.VERCEL_PROTECTION_BYPASS_SECRET }}
          EVENT: ${{ github.event_name }}
        run: |
          : "${APP_URL:?APP_URL repository variable is not set}"
          # Scheduled refreshes serve stale pages while they rebuild instead of dropping them.
          if [ "$EVENT" = schedule ]; then
            bun run admin:cache:invalidate "$APP_URL"
          else
            bun run admin:cache:invalidate "$APP_URL" --immediate
          fi

      - name: Warm up cache
        env:
          APP_URL: ${{ vars.APP_URL }}
          VERCEL_PROTECTION_BYPASS_SECRET: ${{ secrets.VERCEL_PROTECTION_BYPASS_SECRET }}
        run: |
          : "${APP_URL:?APP_URL repository variable is not set}"
          bun run admin:cache:warmup "$APP_URL"
