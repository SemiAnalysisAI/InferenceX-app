name: Ingest OperatorX Results

on:
  repository_dispatch:
    types: [ingest-operatorx]
  workflow_dispatch:
    inputs:
      run-id:
        description: InferenceX operatorx-sweep.yml run ID
        required: true

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.run-id || inputs.run-id }}
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest OperatorX run
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The sweep dispatches this from its own last job, so it is still finishing.
      - name: Wait for the sweep run to complete
        env:
          GH_TOKEN: ${{ secrets.INFX_MAIN_PAT }}
          RUN_ID: ${{ github.event.client_payload.run-id || inputs.run-id }}
        run: |
          for _ in $(seq 60); do
            status=$(gh api "repos/SemiAnalysisAI/InferenceX/actions/runs/$RUN_ID" --jq .status)
            [ "$status" = completed ] && exit 0
            sleep 20
          done
          echo "run $RUN_ID did not complete within 20 minutes" >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ runner.arch }}-${{
            steps.setup-bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ runner.arch }}-${{ steps.setup-bun.outputs.bun-version }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Run migrations
        env:
          DATABASE_OPERATORX_WRITE_URL: ${{ secrets.DATABASE_OPERATORX_WRITE_URL }}
        run: bun run --cwd packages/db src/migrate-operatorx.ts --yes

      - name: Ingest run
        env:
          DATABASE_OPERATORX_WRITE_URL: ${{ secrets.DATABASE_OPERATORX_WRITE_URL }}
          GH_TOKEN: ${{ secrets.INFX_MAIN_PAT }}
          RUN_ID: ${{ github.event.client_payload.run-id || inputs.run-id }}
        run: bun run --cwd packages/db src/ingest-operatorx.ts --download "$RUN_ID" SemiAnalysisAI/InferenceX

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":rotating_light: *Ingest OperatorX workflow failed*\nRun ID: ${{ github.event.client_payload.run-id || inputs.run-id }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
