name: 'Publish H3 media'

on:
  repository_dispatch:
    types: [publish-video-results]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'InferenceX CI source run ID to publish explicitly'
        type: string
        required: false
      backfill_renditions:
        description: 'Encode web playback renditions for every stored H3 MP4 instead of publishing a run'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: 'Publish H3 media'
    if: github.repository == 'SemiAnalysisAI/InferenceX-app' && !inputs.backfill_renditions && (github.event_name == 'workflow_dispatch' || (github.event.client_payload.source_run_id && github.event.client_payload.merge_run_id))
    # Only publication is serialized. A group keeps one pending run and cancels older ones, so
    # encodes must stay outside it; immutable uploads make concurrent rendition jobs safe.
    concurrency:
      group: h3-media-publication
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Persist completed H3 artifacts
        env:
          H3_RUN_ID: ${{ inputs.run_id || github.event.client_payload.source_run_id }}
          H3_MERGE_RUN_ID: ${{ github.event.client_payload.merge_run_id }}
          H3_PUBLICATION_EVENT: ${{ github.event_name }}
          INFERENCEX_APP_URL: ${{ vars.APP_URL }}
          INVALIDATE_SECRET: ${{ secrets.VERCEL_INVALIDATE_SECRET }}
          VERCEL_PROTECTION_BYPASS_SECRET: ${{ secrets.VERCEL_PROTECTION_BYPASS_SECRET }}
        run: |
          : "${INFERENCEX_APP_URL:?APP_URL repository variable is not set}"
          : "${INVALIDATE_SECRET:?VERCEL_INVALIDATE_SECRET is not set}"
          bun packages/app/scripts/warm-video-results.ts

  renditions:
    name: 'Encode web playback renditions'
    needs: publish
    # Runs after a successful publication, or alone for a backfill. Originals keep serving if it fails.
    if: ${{ !cancelled() && github.repository == 'SemiAnalysisAI/InferenceX-app' && (needs.publish.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.backfill_renditions)) }}
    # One group per source run (or for backfill), so a queued encode never cancels another run's.
    concurrency:
      group: h3-media-renditions-${{ inputs.backfill_renditions && 'backfill' || inputs.run_id || github.event.client_payload.source_run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.backfill_renditions && 180 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Encode web playback renditions
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          H3_BACKFILL_RENDITIONS: ${{ inputs.backfill_renditions }}
          H3_RUN_ID: ${{ inputs.run_id || github.event.client_payload.source_run_id }}
        run: |
          if [ "$H3_BACKFILL_RENDITIONS" = true ]; then
            bun packages/app/scripts/video-renditions.ts
          else
            bun packages/app/scripts/video-renditions.ts --run "$H3_RUN_ID"
          fi
