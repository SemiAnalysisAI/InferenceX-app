<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>InferenceX — Cost vs Interactivity (Pareto)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 24px;
        color: #212121;
      }
      #controls {
        display: flex;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      #controls label {
        font-size: 13px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      #chart-wrap {
        position: relative;
        height: 60vh;
        min-height: 380px;
      }
      #status {
        color: #b71c1c;
        font-size: 14px;
      }
      #meta {
        color: #757575;
        font-size: 11px;
        margin-top: 8px;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1>InferenceX — cost vs interactivity</h1>
    <div id="controls">
      <label
        >Model
        <select id="model"></select
      ></label>
      <label
        >Sequence
        <select id="sequence"></select
      ></label>
      <label
        >Metric
        <select id="metric"></select
      ></label>
      <label
        >Percentile
        <select id="percentile">
          <option value="p90" selected>p90</option>
          <option value="p75">p75</option>
        </select>
      </label>
      <label
        >Frontier only
        <input type="checkbox" id="optimal" />
      </label>
    </div>
    <p id="status"></p>
    <div id="chart-wrap"><canvas id="chart"></canvas></div>
    <p id="meta"></p>

    <script>
      const BASE = 'https://inferencex.semianalysis.com';

      // Consistent hardware colors (keyed by GPU base key = first hwKey segment).
      const GPU_COLORS = {
        h100: '#8bc34a',
        h200: '#4caf50',
        b200: '#009688',
        b300: '#00bcd4',
        gb200: '#3f51b5',
        gb300: '#673ab7',
        vr200: '#2196f3',
        rtx6000pro: '#607d8b',
        mi300x: '#ff9800',
        mi325x: '#f44336',
        mi355x: '#e91e63',
        jalapeno: '#795548',
      };
      const colorFor = (hwKey) => GPU_COLORS[hwKey.split('_')[0].toLowerCase()] || '#9e9e9e';

      async function getView(name, params = {}) {
        const url = new URL(`${BASE}/api/v1/views/${name}`);
        for (const [k, v] of Object.entries(params))
          if (v !== undefined && v !== '') url.searchParams.set(k, v);
        const res = await fetch(url);
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(
            res.status === 404
              ? 'views API (beta) not available at this base URL yet'
              : `${res.status}: ${body.error || 'request failed'}${body.allowed ? ` — allowed: ${body.allowed.join(', ')}` : ''}`,
          );
        }
        return res.json();
      }

      let chart;

      async function draw() {
        const status = document.getElementById('status');
        status.textContent = 'Loading…';
        try {
          const view = await getView('inference', {
            model: document.getElementById('model').value,
            sequence: document.getElementById('sequence').value,
            metric: document.getElementById('metric').value,
            percentile: document.getElementById('percentile').value,
            xmode: 'interactivity',
            optimal: document.getElementById('optimal').checked ? 'true' : undefined,
          });
          status.textContent = '';

          const datasets = view.series
            .filter((s) => s.points.length > 0)
            .map((s) => ({
              type: 'scatter',
              label: s.label,
              data: s.points.map((p) => ({ x: p.x, y: p.y })),
              backgroundColor: colorFor(s.hwKey) + 'c0',
              pointRadius: 4,
            }));

          // Pareto frontier: points flagged frontier=true across all series, sorted by x.
          const frontier = view.series
            .flatMap((s) => s.points.filter((p) => p.frontier))
            .sort((a, b) => a.x - b.x)
            .map((p) => ({ x: p.x, y: p.y }));
          if (frontier.length > 1) {
            datasets.push({
              type: 'line',
              label: 'Pareto frontier',
              data: frontier,
              borderColor: '#212121',
              borderWidth: 1.5,
              borderDash: [6, 4],
              pointRadius: 0,
              fill: false,
              showLine: true,
            });
          }

          // Registry labels usually already end with their unit, e.g. "... ($)".
          const yTitle =
            view.metric.unit && !/\)\s*$/.test(view.metric.label)
              ? `${view.metric.label} (${view.metric.unit})`
              : view.metric.label;
          if (chart) chart.destroy();
          chart = new Chart(document.getElementById('chart'), {
            data: { datasets },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              animation: false,
              scales: {
                x: {
                  type: 'logarithmic',
                  title: { display: true, text: view.xAxis.label || 'Interactivity (tok/s/user)' },
                },
                y: { type: 'logarithmic', title: { display: true, text: yTitle } },
              },
              plugins: { legend: { labels: { boxWidth: 10, font: { size: 10 } } } },
            },
          });
          document.getElementById('meta').textContent =
            `InferenceX views API · generatedAt=${view.generatedAt} · params=${JSON.stringify(view.params)}`;
        } catch (err) {
          status.textContent = `Error: ${err.message}`;
        }
      }

      function fill(id, values, selected) {
        const el = document.getElementById(id);
        el.innerHTML = '';
        for (const v of values) {
          const o = document.createElement('option');
          o.value = v.value;
          o.textContent = v.label;
          if (v.value === selected) o.selected = true;
          el.appendChild(o);
        }
      }

      async function init() {
        try {
          // Discovery: populate controls from the options endpoint.
          const opts = await getView('options');
          fill(
            'model',
            opts.models.map((m) => ({ value: m.name, label: m.name })),
            'DeepSeek-V4-Pro',
          );
          fill(
            'sequence',
            opts.sequences.map((s) => ({ value: s.key, label: s.key })),
            '8k/1k',
          );
          fill(
            'metric',
            opts.metrics.map((m) => ({ value: m.key, label: m.label })),
            'costh',
          );
        } catch {
          // Fallback if options is unreachable: sensible documented defaults.
          fill(
            'model',
            [{ value: 'DeepSeek-V4-Pro', label: 'DeepSeek-V4-Pro' }],
            'DeepSeek-V4-Pro',
          );
          fill(
            'sequence',
            ['8k/1k', '1k/1k', '1k/8k', 'agentic-traces'].map((v) => ({ value: v, label: v })),
            '8k/1k',
          );
          fill(
            'metric',
            ['costh', 'costn', 'costr', 'tokensPerDollarN', 'tpPerGpu'].map((v) => ({
              value: v,
              label: v,
            })),
            'costh',
          );
        }
        for (const id of ['model', 'sequence', 'metric', 'percentile', 'optimal']) {
          document.getElementById(id).addEventListener('change', draw);
        }
        draw();
      }

      init();
    </script>
  </body>
</html>
