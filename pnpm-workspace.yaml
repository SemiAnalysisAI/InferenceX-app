packages:
  - packages/*

allowBuilds:
  '@posthog/cli': true
  core-js: true
  cypress: true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

# Security pins for advisories not fixable via pnpm overrides:
# - vite and @babel/core only appear as peer deps (vitest; styled-jsx / babel plugins),
#   and pnpm overrides don't apply to peers, so they are pinned to patched versions as
#   direct devDependencies in the root package.json instead.
# - gray-matter calls js-yaml's safeLoad/safeDump APIs, which 4.x removes. Keep js-yaml
#   on the patched 3.15.x line; the remaining build-time advisory applies only to trusted
#   frontmatter input and is ignored below.
auditConfig:
  ignoreGhsas:
    - GHSA-h67p-54hq-rp68

overrides:
  '@hono/node-server@<2.0.5': '>=2.0.5'
  body-parser@>=2.0.0 <2.3.0: '>=2.3.0'
  brace-expansion@>=3.0.0 <=5.0.7: '>=5.0.8'
  dompurify@<=3.4.11: '>=3.4.12'
  fast-uri@>=3.0.0 <=3.1.3: '>=3.1.4'
  js-yaml@>=3.0.0 <3.15.0: '>=3.15.0 <4.0.0'
  hono@>=4.0.0 <4.12.27: '>=4.12.27'
  postcss@<=8.5.17: '>=8.5.18'
  sharp@<0.35.0: '>=0.35.0'
